<section class="relation-picker">
  <div class="relation-picker-copy">
    <h4>{{ label() }}</h4>
    @if (description()) {
      <p>{{ description() }}</p>
    }
  </div>
  @if (options().length > 0) {
    <div class="relation-picker-list">
      @for (option of options(); track option.id) {
        <hans-button
          [buttonColor]="'primary'"
          [buttonVariant]="isSelected(option.id) ? 'default' : 'outline'"
          [attr.aria-pressed]="isSelected(option.id)"
          (click)="toggled.emit(option.id)"
        >
          <span class="relation-picker-option">
            @if (option.imageUrl) {
              <img [src]="option.imageUrl" [alt]="option.title" />
            }
            <span class="relation-picker-option-copy">
              <span>{{ option.title }}</span>
              @if (option.subtitle) {
                <small [title]="option.subtitle">{{ option.subtitle }}</small>
              }
            </span>
          </span>
        </hans-button>
      }
    </div>
  } @else {
    <p class="relation-picker-empty">{{ emptyMessage() }}</p>
  }
</section>
