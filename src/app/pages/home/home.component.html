<app-wrapper>
  <app-home-hero-section page-main [hero]="hero" />

  <div page-content class="home-page-body">
    @if (isLoading()) {
      <div class="home-page-state">
        <app-info-state mode="loading" [message]="'pages.home.loading' | translate" />
      </div>
    } @else if (hasError()) {
      <div class="home-page-state">
        <app-info-state mode="error" [message]="'pages.home.error' | translate" />
      </div>
    } @else {
      <app-home-primary-cards
        [ariaLabelKey]="'pages.home.metrics.ariaLabel'"
        [cards]="primaryCards()"
      />

      @if (topTechnologyChips().length > 0) {
        <app-home-stack-chips
          [labelKey]="'pages.home.stack.label'"
          [titleKey]="'pages.home.stack.title'"
          [descriptionKey]="'pages.home.stack.description'"
          [chips]="topTechnologyChips()"
          (openTechnology)="openTechnologyDetails($event)"
        />
        <div class="home-page-action">
          <hans-button
            routerLink="/skills"
            [label]="'pages.home.stack.moreSkills' | translate"
            [buttonStyle]="'solid'"
          ></hans-button>
        </div>
      } @else {
        <div class="home-page-state">
          <app-info-state mode="empty" [message]="'common.empty.stackDistribution' | translate" />
        </div>
      }


      @if (highlightedProjects().length > 0) {
        <section class="home-highlighted-projects">
          <app-section-header
            presentation="compact-centered"
            [sectionLabel]="'pages.home.highlightedProjects.label' | translate"
            [title]="'pages.home.highlightedProjects.title' | translate"
            [description]="'pages.home.highlightedProjects.description' | translate"
          />

          <app-home-secondary-cards
            [cards]="highlightedProjects()"
            (openProject)="openProjectDetails($event)"
          />

          <div class="home-page-action">
            <hans-button
              routerLink="/projects"
              [label]="'pages.home.highlightedProjects.moreProjects' | translate"
              [buttonStyle]="'solid'"
            ></hans-button>
          </div>
        </section>
      }
    }
  </div>
</app-wrapper>

@if (selectedProject(); as project) {
  <app-project-modal
    [isOpen]="true"
    [project]="project"
    (closed)="closeProjectDetails()"
    (openTechnology)="openTechnologyDetails($event)"
  />
}

@if (selectedTechnology(); as technology) {
  <app-technology-modal
    [isOpen]="true"
    [technology]="technology"
    (closed)="closeTechnologyDetails()"
  />
}
