<section class="admin-page">
  <div class="admin-page-shell">
    <app-section-header
      [sectionLabel]="'pages.admin.shell.eyebrow' | translate"
      [title]="'pages.admin.shell.title' | translate"
      [description]="'pages.admin.shell.description' | translate"
    >
      <hans-button
        sectionHeaderActions
        class="admin-page-logout"
        [attr.aria-label]="'pages.admin.shell.actions.logout' | translate"
        [buttonColor]="'base'"
        [buttonSize]="'medium'"
        [buttonVariant]="'outline'"
        (click)="logout()"
      >
        {{ 'pages.admin.shell.actions.logout' | translate }}
      </hans-button>
    </app-section-header>

    <div class="admin-page-overview">
      <article class="admin-page-card admin-page-card-accent">
        <p class="admin-page-kicker">
          {{ 'pages.admin.shell.session.kicker' | translate }}
        </p>
        <h2>{{ adminIdentity() }}</h2>
        <p>{{ adminUserEmail() }}</p>
      </article>
    </div>

    <div class="admin-page-entities">
      <div class="admin-page-entity-grid">
        <app-links-operations #linksWorkspace />

        <app-image-assets-operations #imageAssetsWorkspace />

        <app-spoken-languages-operations #spokenLanguagesWorkspace />

        <app-customers-operations #customersWorkspace />

        <app-jobs-operations #jobsWorkspace />

        <app-formations-operations #formationsWorkspace />

        <app-technologies-operations #technologiesWorkspace />

        <app-technology-contexts-operations #technologyContextsWorkspace />

        <app-experiences-operations #experiencesWorkspace />

        <app-projects-operations #projectsWorkspace />
      </div>
    </div>
  </div>
</section>
