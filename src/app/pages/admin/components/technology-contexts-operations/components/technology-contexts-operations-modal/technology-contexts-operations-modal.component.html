<app-operations-modal
  [isOpen]="isOpen()"
  [titleKey]="modalTitleKey()"
  [descriptionKey]="descriptionKey()"
  [feedbackKey]="feedbackKey()"
  [feedbackTone]="feedbackTone()"
  [pagination]="pagination()"
  [showPagination]="showPagination()"
  [showSearch]="showPagination()"
  [searchValue]="searchValue()"
  [isLoading]="isLoading()"
  [isSubmitting]="isSubmitting()"
  [showSubmit]="showSubmit()"
  [submitLabelKey]="submitLabelKey()"
  [mode]="modalMode()"
  [items]="operationItems()"
  [detailedItems]="detailedOperationItems()"
  [selectedItem]="selectedOperationItem()"
  (closed)="closed.emit()"
  (searchChanged)="searchChanged.emit($event)"
  (submitted)="submit()"
  (pageSelected)="pageSelected.emit($event)"
  (updateSelected)="updateSelected.emit($event)"
  (deleteSelected)="deleteSelected.emit($event)"
>
  @if (modalMode(); as mode) {
    @if (mode === 'create' || mode === 'update') {
      <div class="technology-contexts-operations-form">
        <hans-select-option
          [label]="resolveFieldLabel('technologyId')"
          [required]="fields.technologyId.required"
          [value]="form().technologyId"
          [options]="technologyOptions()"
          inputColor="base"
          inputSize="medium"
          labelColor="base"
          dropdownBackgroundColor="var(--background-color)"
          dropdownHoverColor="var(--primary-neutral-color)"
          (change)="change('technologyId', $event)"
          (valuechange)="change('technologyId', $event)"
          (valueChange)="change('technologyId', $event)"
        ></hans-select-option>

        <hans-select-option
          [label]="resolveFieldLabel('context')"
          [required]="fields.context.required"
          [value]="form().context"
          [options]="contextOptions()"
          inputColor="base"
          inputSize="medium"
          labelColor="base"
          dropdownBackgroundColor="var(--background-color)"
          dropdownHoverColor="var(--primary-neutral-color)"
          (change)="change('context', $event)"
          (valuechange)="change('context', $event)"
          (valueChange)="change('context', $event)"
        ></hans-select-option>

        <hans-date-picker
          [label]="resolveFieldLabel('startedAt')"
          [required]="fields.startedAt.required"
          pickerType="date"
          [dateFormat]="datePickerFormat()"
          [locale]="datePickerLocale()"
          inputColor="base"
          inputSize="medium"
          [value]="form().startedAt"
          [allowInputTyping]="false"
          popupBackgroundColor="var(--background-color)"
          panelBackgroundColor="var(--background-color)"
          (change)="change('startedAt', $event)"
        ></hans-date-picker>

        <hans-date-picker
          [label]="resolveFieldLabel('endedAt')"
          [required]="fields.endedAt.required"
          pickerType="date"
          [dateFormat]="datePickerFormat()"
          [locale]="datePickerLocale()"
          inputColor="base"
          inputSize="medium"
          [value]="form().endedAt"
          [allowInputTyping]="false"
          popupBackgroundColor="var(--background-color)"
          panelBackgroundColor="var(--background-color)"
          (change)="change('endedAt', $event)"
        ></hans-date-picker>
      </div>
    }
  }
</app-operations-modal>
