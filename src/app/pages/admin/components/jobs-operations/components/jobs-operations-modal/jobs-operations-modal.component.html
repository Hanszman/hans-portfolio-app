<app-operations-modal
  [isOpen]="isOpen()"
  [titleKey]="modalTitleKey()"
  [descriptionKey]="descriptionKey()"
  [feedbackKey]="feedbackKey()"
  [feedbackTone]="feedbackTone()"
  [pagination]="pagination()"
  [showPagination]="showPagination()"
  [showSearch]="showPagination()"
  [searchValue]="searchValue()"
  [isLoading]="isLoading()"
  [isSubmitting]="isSubmitting()"
  [showSubmit]="showSubmit()"
  [submitLabelKey]="submitLabelKey()"
  [mode]="modalMode()"
  [items]="operationItems()"
  [detailedItems]="detailedOperationItems()"
  [selectedItem]="selectedOperationItem()"
  (closed)="requestClose()"
  (searchChanged)="searchChanged.emit($event)"
  (submitted)="submit()"
  (pageSelected)="selectPage($event)"
  (updateSelected)="selectJobForUpdate($event)"
  (deleteSelected)="selectJobForDelete($event)"
>
  @if (modalMode(); as modalMode) {
    @if (modalMode === 'create' || modalMode === 'update') {
      <div class="jobs-operations-form">
        <hans-input
          [label]="resolveFieldLabel('slug')"
          inputColor="base"
          inputSize="medium"
          [value]="form().slug"
          [placeholder]="fields.slug.placeholderKey! | translate"
          [attr.aria-label]="fields.slug.labelKey | translate"
          (input)="emitSlugChange($any($event).target?.value ?? '')"
        ></hans-input>

        <hans-input
          [label]="resolveFieldLabel('namePt')"
          inputColor="base"
          inputSize="medium"
          [value]="form().namePt"
          [placeholder]="fields.namePt.placeholderKey! | translate"
          [attr.aria-label]="fields.namePt.labelKey | translate"
          (input)="emitNamePtChange($any($event).target?.value ?? '')"
        ></hans-input>

        <hans-input
          [label]="resolveFieldLabel('nameEn')"
          inputColor="base"
          inputSize="medium"
          [value]="form().nameEn"
          [placeholder]="fields.nameEn.placeholderKey! | translate"
          [attr.aria-label]="fields.nameEn.labelKey | translate"
          (input)="emitNameEnChange($any($event).target?.value ?? '')"
        ></hans-input>

        <hans-input
          [label]="resolveFieldLabel('summaryPt')"
          inputColor="base"
          inputSize="medium"
          [value]="form().summaryPt"
          [placeholder]="fields.summaryPt.placeholderKey! | translate"
          [attr.aria-label]="fields.summaryPt.labelKey | translate"
          (input)="emitSummaryPtChange($any($event).target?.value ?? '')"
        ></hans-input>

        <hans-input
          [label]="resolveFieldLabel('summaryEn')"
          inputColor="base"
          inputSize="medium"
          [value]="form().summaryEn"
          [placeholder]="fields.summaryEn.placeholderKey! | translate"
          [attr.aria-label]="fields.summaryEn.labelKey | translate"
          (input)="emitSummaryEnChange($any($event).target?.value ?? '')"
        ></hans-input>

        <div class="jobs-operations-toggle">
          <div class="jobs-operations-selection-copy">
            <p>{{ 'pages.admin.jobs.fields.highlight.label' | translate }}</p>
            <span>
              {{ 'pages.admin.jobs.fields.highlight.description' | translate }}
            </span>
          </div>

          <hans-toggle
            [checked]="form().highlight"
            [toggleColor]="'primary'"
            [toggleSize]="'small'"
            [attr.aria-label]="'pages.admin.jobs.fields.highlight.label' | translate"
            (change)="emitHighlightChange($event)"
          ></hans-toggle>
        </div>

        <hans-input
          [label]="resolveFieldLabel('sortOrder')"
          inputColor="base"
          inputSize="medium"
          [value]="form().sortOrder"
          [placeholder]="fields.sortOrder.placeholderKey! | translate"
          [attr.aria-label]="fields.sortOrder.labelKey | translate"
          (input)="emitSortOrderChange($any($event).target?.value ?? '')"
        ></hans-input>

        <app-operations-relation-picker
          [label]="'pages.admin.jobs.fields.experiences.label' | translate"
          [description]="'pages.admin.jobs.fields.experiences.description' | translate"
          [emptyMessage]="'pages.admin.jobs.fields.experiences.empty' | translate"
          [options]="experienceOptions()"
          [selectedIds]="form().experienceIds"
          (toggled)="toggleExperience($event)"
        ></app-operations-relation-picker>

        <app-operations-relation-picker
          [label]="'pages.admin.jobs.fields.imageAssets.label' | translate"
          [description]="'pages.admin.jobs.fields.imageAssets.description' | translate"
          [emptyMessage]="'pages.admin.jobs.fields.imageAssets.empty' | translate"
          [options]="imageAssetOptions()"
          [selectedIds]="form().imageAssetIds"
          (toggled)="toggleImageAsset($event)"
        ></app-operations-relation-picker>
      </div>
    }
  }
</app-operations-modal>
