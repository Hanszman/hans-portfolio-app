<app-operations-modal
  [isOpen]="isOpen()"
  [titleKey]="modalTitleKey()"
  [descriptionKey]="descriptionKey()"
  [feedbackKey]="feedbackKey()"
  [feedbackTone]="feedbackTone()"
  [pagination]="pagination()"
  [showPagination]="showPagination()"
  [showSearch]="showPagination()"
  [searchValue]="searchValue()"
  [isLoading]="isLoading()"
  [isSubmitting]="isSubmitting()"
  [showSubmit]="showSubmit()"
  [submitLabelKey]="submitLabelKey()"
  [mode]="modalMode()"
  [items]="operationItems()"
  [detailedItems]="detailedOperationItems()"
  [selectedItem]="selectedOperationItem()"
  (closed)="requestClose()"
  (searchChanged)="searchChanged.emit($event)"
  (submitted)="submit()"
  (pageSelected)="selectPage($event)"
  (updateSelected)="selectFormationForUpdate($event)"
  (deleteSelected)="selectFormationForDelete($event)"
>
  @if (modalMode(); as modalMode) {
    @if (modalMode === 'create' || modalMode === 'update') {
      <div class="formations-operations-form">
        <hans-input
          [label]="resolveFieldLabel('slug')"
          [required]="fields.slug.required"
          inputColor="base"
          inputSize="medium"
          [value]="form().slug"
          [placeholder]="fields.slug.placeholderKey! | translate"
          [attr.aria-label]="fields.slug.labelKey | translate"
          (input)="emitSlugChange($any($event).target?.value ?? '')"
        ></hans-input>

        <hans-input
          [label]="resolveFieldLabel('institution')"
          [required]="fields.institution.required"
          inputColor="base"
          inputSize="medium"
          [value]="form().institution"
          [placeholder]="fields.institution.placeholderKey! | translate"
          [attr.aria-label]="fields.institution.labelKey | translate"
          (input)="emitInstitutionChange($any($event).target?.value ?? '')"
        ></hans-input>

        <hans-input
          [label]="resolveFieldLabel('titlePt')"
          [required]="fields.titlePt.required"
          inputColor="base"
          inputSize="medium"
          [value]="form().titlePt"
          [placeholder]="fields.titlePt.placeholderKey! | translate"
          [attr.aria-label]="fields.titlePt.labelKey | translate"
          (input)="emitTitlePtChange($any($event).target?.value ?? '')"
        ></hans-input>

        <hans-input
          [label]="resolveFieldLabel('titleEn')"
          [required]="fields.titleEn.required"
          inputColor="base"
          inputSize="medium"
          [value]="form().titleEn"
          [placeholder]="fields.titleEn.placeholderKey! | translate"
          [attr.aria-label]="fields.titleEn.labelKey | translate"
          (input)="emitTitleEnChange($any($event).target?.value ?? '')"
        ></hans-input>

        <hans-input
          [label]="resolveFieldLabel('titleEs')"
          [required]="fields.titleEs.required"
          inputColor="base"
          inputSize="medium"
          [value]="form().titleEs"
          [placeholder]="fields.titleEs.placeholderKey! | translate"
          [attr.aria-label]="fields.titleEs.labelKey | translate"
          (input)="emitTitleEsChange($any($event).target?.value ?? '')"
        ></hans-input>

        <hans-select-option
          [label]="resolveFieldLabel('degreeType')"
          [required]="fields.degreeType.required"
          [options]="degreeTypeOptions()"
          [value]="form().degreeType"
          [enableAutocomplete]="false"
          [noOptionsText]="'pages.admin.formations.fields.degreeType.empty' | translate"
          inputSize="medium"
          inputColor="base"
          labelColor="base"
          dropdownBackgroundColor="var(--background-color)"
          dropdownHoverColor="var(--primary-neutral-color)"
          (change)="emitDegreeTypeChange(resolveSelectValue($event))"
          (valuechange)="emitDegreeTypeChange(resolveSelectValue($event))"
          (valueChange)="emitDegreeTypeChange(resolveSelectValue($event))"
        ></hans-select-option>

        <hans-input
          [label]="resolveFieldLabel('summaryPt')"
          [required]="fields.summaryPt.required"
          inputColor="base"
          inputSize="medium"
          [value]="form().summaryPt"
          [placeholder]="fields.summaryPt.placeholderKey! | translate"
          [attr.aria-label]="fields.summaryPt.labelKey | translate"
          (input)="emitSummaryPtChange($any($event).target?.value ?? '')"
        ></hans-input>

        <hans-input
          [label]="resolveFieldLabel('summaryEn')"
          [required]="fields.summaryEn.required"
          inputColor="base"
          inputSize="medium"
          [value]="form().summaryEn"
          [placeholder]="fields.summaryEn.placeholderKey! | translate"
          [attr.aria-label]="fields.summaryEn.labelKey | translate"
          (input)="emitSummaryEnChange($any($event).target?.value ?? '')"
        ></hans-input>

        <hans-input
          [label]="resolveFieldLabel('summaryEs')"
          [required]="fields.summaryEs.required"
          inputColor="base"
          inputSize="medium"
          [value]="form().summaryEs"
          [placeholder]="fields.summaryEs.placeholderKey! | translate"
          [attr.aria-label]="fields.summaryEs.labelKey | translate"
          (input)="emitSummaryEsChange($any($event).target?.value ?? '')"
        ></hans-input>

        <hans-date-picker
          [label]="resolveFieldLabel('startDate')"
          [required]="fields.startDate.required"
          pickerType="date"
          [dateFormat]="datePickerFormat()"
          [locale]="datePickerLocale()"
          inputColor="base"
          inputSize="medium"
          [value]="form().startDate"
          [placeholder]="datePickerFormat()"
          [allowInputTyping]="false"
          popupBackgroundColor="var(--background-color)"
          panelBackgroundColor="var(--background-color)"
          [attr.aria-label]="fields.startDate.labelKey | translate"
          (change)="emitStartDateChange(resolveSelectValue($event))"
        ></hans-date-picker>

        <hans-date-picker
          [label]="resolveFieldLabel('endDate')"
          [required]="fields.endDate.required"
          pickerType="date"
          [dateFormat]="datePickerFormat()"
          [locale]="datePickerLocale()"
          inputColor="base"
          inputSize="medium"
          [value]="form().endDate"
          [placeholder]="datePickerFormat()"
          [allowInputTyping]="false"
          popupBackgroundColor="var(--background-color)"
          panelBackgroundColor="var(--background-color)"
          [attr.aria-label]="fields.endDate.labelKey | translate"
          (change)="emitEndDateChange(resolveSelectValue($event))"
        ></hans-date-picker>

        <div class="formations-operations-toggle">
          <div class="formations-operations-selection-copy">
            <p>{{ 'common.fields.highlightStatus' | translate }}</p>
            <span>
              {{ 'pages.admin.formations.fields.highlight.description' | translate }}
            </span>
          </div>

          <hans-toggle
            [checked]="form().highlight"
            [toggleColor]="'primary'"
            [toggleSize]="'small'"
            [attr.aria-label]="'common.fields.highlightStatus' | translate"
            (change)="emitHighlightChange($event)"
          ></hans-toggle>
        </div>

        <hans-input
          [label]="resolveFieldLabel('sortOrder')"
          [required]="fields.sortOrder.required"
          inputColor="base"
          inputSize="medium"
          [value]="form().sortOrder"
          [placeholder]="fields.sortOrder.placeholderKey! | translate"
          [attr.aria-label]="fields.sortOrder.labelKey | translate"
          (input)="emitSortOrderChange($any($event).target?.value ?? '')"
        ></hans-input>

        <app-operations-relation-picker
          [label]="'pages.admin.formations.fields.technologies.label' | translate"
          [description]="'pages.admin.formations.fields.technologies.description' | translate"
          [emptyMessage]="'pages.admin.formations.fields.technologies.empty' | translate"
          [options]="technologyOptions()"
          [selectedIds]="form().technologyIds"
          (toggled)="toggleTechnology($event)"
        ></app-operations-relation-picker>

        <app-operations-relation-picker
          [label]="'common.relations.links' | translate"
          [description]="'pages.admin.formations.fields.links.description' | translate"
          [emptyMessage]="'pages.admin.formations.fields.links.empty' | translate"
          [options]="linkOptions()"
          [selectedIds]="form().linkIds"
          (toggled)="toggleLink($event)"
        ></app-operations-relation-picker>

        <app-operations-relation-picker
          [label]="'common.relations.imageAssets' | translate"
          [description]="'pages.admin.formations.fields.imageAssets.description' | translate"
          [emptyMessage]="'common.empty.imageAssetsForRelation' | translate"
          [options]="imageAssetOptions()"
          [selectedIds]="form().imageAssetIds"
          (toggled)="toggleImageAsset($event)"
        ></app-operations-relation-picker>
      </div>
    }
  }
</app-operations-modal>
