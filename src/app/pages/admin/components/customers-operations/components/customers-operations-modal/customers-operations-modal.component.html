<app-operations-modal
  [isOpen]="isOpen()"
  [titleKey]="modalTitleKey()"
  [descriptionKey]="descriptionKey()"
  [feedbackKey]="feedbackKey()"
  [feedbackTone]="feedbackTone()"
  [pagination]="pagination()"
  [showPagination]="showPagination()"
  [showSearch]="showPagination()"
  [searchValue]="searchValue()"
  [isLoading]="isLoading()"
  [isSubmitting]="isSubmitting()"
  [showSubmit]="showSubmit()"
  [submitLabelKey]="submitLabelKey()"
  [mode]="modalMode()"
  [items]="operationItems()"
  [detailedItems]="detailedOperationItems()"
  [selectedItem]="selectedOperationItem()"
  (closed)="requestClose()"
  (searchChanged)="searchChanged.emit($event)"
  (submitted)="submit()"
  (pageSelected)="selectPage($event)"
  (updateSelected)="selectCustomerForUpdate($event)"
  (deleteSelected)="selectCustomerForDelete($event)"
>
  @if (modalMode(); as modalMode) {
    @if (modalMode === 'create' || modalMode === 'update') {
      <div class="customers-operations-form">
        <hans-input
          [label]="resolveFieldLabel('slug')"
          [required]="fields.slug.required"
          inputColor="base"
          inputSize="medium"
          [value]="form().slug"
          [placeholder]="fields.slug.placeholderKey! | translate"
          [attr.aria-label]="fields.slug.labelKey | translate"
          (input)="emitSlugChange($any($event).target?.value ?? '')"
        ></hans-input>

        <hans-input
          [label]="resolveFieldLabel('name')"
          [required]="fields.name.required"
          inputColor="base"
          inputSize="medium"
          [value]="form().name"
          [placeholder]="fields.name.placeholderKey! | translate"
          [attr.aria-label]="fields.name.labelKey | translate"
          (input)="emitNameChange($any($event).target?.value ?? '')"
        ></hans-input>

        <hans-textarea
          [label]="resolveFieldLabel('summaryPt')"
          [formattingToolbar]="true"
          [rows]="6"
          [formattingToolbarAriaLabel]="'common.formatting.toolbar' | translate"
          [boldButtonAriaLabel]="'common.formatting.bold' | translate"
          [italicButtonAriaLabel]="'common.formatting.italic' | translate"
          [underlineButtonAriaLabel]="'common.formatting.underline' | translate"
          [listButtonAriaLabel]="'common.formatting.unorderedList' | translate"
          [required]="fields.summaryPt.required"
          textareaColor="base"
          textareaSize="medium"
          [value]="form().summaryPt"
          [placeholder]="fields.summaryPt.placeholderKey! | translate"
          [attr.aria-label]="fields.summaryPt.labelKey | translate"
          (valuechange)="emitSummaryPtChange($any($event).detail ?? '')"
        ></hans-textarea>

        <hans-textarea
          [label]="resolveFieldLabel('summaryEn')"
          [formattingToolbar]="true"
          [rows]="6"
          [formattingToolbarAriaLabel]="'common.formatting.toolbar' | translate"
          [boldButtonAriaLabel]="'common.formatting.bold' | translate"
          [italicButtonAriaLabel]="'common.formatting.italic' | translate"
          [underlineButtonAriaLabel]="'common.formatting.underline' | translate"
          [listButtonAriaLabel]="'common.formatting.unorderedList' | translate"
          [required]="fields.summaryEn.required"
          textareaColor="base"
          textareaSize="medium"
          [value]="form().summaryEn"
          [placeholder]="fields.summaryEn.placeholderKey! | translate"
          [attr.aria-label]="fields.summaryEn.labelKey | translate"
          (valuechange)="emitSummaryEnChange($any($event).detail ?? '')"
        ></hans-textarea>

        <hans-textarea
          [label]="resolveFieldLabel('summaryEs')"
          [formattingToolbar]="true"
          [rows]="6"
          [formattingToolbarAriaLabel]="'common.formatting.toolbar' | translate"
          [boldButtonAriaLabel]="'common.formatting.bold' | translate"
          [italicButtonAriaLabel]="'common.formatting.italic' | translate"
          [underlineButtonAriaLabel]="'common.formatting.underline' | translate"
          [listButtonAriaLabel]="'common.formatting.unorderedList' | translate"
          [required]="fields.summaryEs.required"
          textareaColor="base"
          textareaSize="medium"
          [value]="form().summaryEs"
          [placeholder]="fields.summaryEs.placeholderKey! | translate"
          [attr.aria-label]="fields.summaryEs.labelKey | translate"
          (valuechange)="emitSummaryEsChange($any($event).detail ?? '')"
        ></hans-textarea>

        <div class="customers-operations-toggle">
          <div class="customers-operations-selection-copy">
            <p>{{ 'common.fields.highlightStatus' | translate }}</p>
            <span>
              {{ 'pages.admin.customers.fields.highlight.description' | translate }}
            </span>
          </div>

          <hans-toggle
            [checked]="form().highlight"
            [toggleColor]="'primary'"
            [toggleSize]="'small'"
            [attr.aria-label]="'common.fields.highlightStatus' | translate"
            (change)="emitHighlightChange($event)"
          ></hans-toggle>
        </div>

        <hans-input
          [label]="resolveFieldLabel('sortOrder')"
          [required]="fields.sortOrder.required"
          inputColor="base"
          inputSize="medium"
          [value]="form().sortOrder"
          [placeholder]="fields.sortOrder.placeholderKey! | translate"
          [attr.aria-label]="fields.sortOrder.labelKey | translate"
          (input)="emitSortOrderChange($any($event).target?.value ?? '')"
        ></hans-input>

        <app-operations-relation-picker
          [label]="'common.relations.experiences' | translate"
          [description]="'pages.admin.customers.fields.experiences.description' | translate"
          [emptyMessage]="'pages.admin.customers.fields.experiences.empty' | translate"
          [options]="experienceOptions()"
          [selectedIds]="form().experienceIds"
          (toggled)="toggleExperience($event)"
        ></app-operations-relation-picker>

        <app-operations-relation-picker
          [label]="'common.relations.imageAssets' | translate"
          [description]="'pages.admin.customers.fields.imageAssets.description' | translate"
          [emptyMessage]="'pages.admin.customers.fields.imageAssets.empty' | translate"
          [options]="imageAssetOptions()"
          [selectedIds]="form().imageAssetIds"
          (toggled)="toggleImageAsset($event)"
        ></app-operations-relation-picker>
      </div>
    }
  }
</app-operations-modal>
