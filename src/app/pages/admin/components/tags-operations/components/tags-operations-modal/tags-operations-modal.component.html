<app-operations-modal
  [isOpen]="isOpen()"
  [titleKey]="modalTitleKey()"
  [descriptionKey]="descriptionKey()"
  [feedbackKey]="feedbackKey()"
  [feedbackTone]="feedbackTone()"
  [pagination]="pagination()"
  [showPagination]="showPagination()"
  [showSearch]="showPagination()"
  [searchValue]="searchValue()"
  [isLoading]="isLoading()"
  [isSubmitting]="isSubmitting()"
  [showSubmit]="showSubmit()"
  [submitLabelKey]="submitLabelKey()"
  [mode]="modalMode()"
  [items]="operationItems()"
  [detailedItems]="detailedOperationItems()"
  [selectedItem]="selectedOperationItem()"
  (closed)="requestClose()"
  (searchChanged)="searchChanged.emit($event)"
  (submitted)="submit()"
  (pageSelected)="selectPage($event)"
  (updateSelected)="selectTagForUpdate($event)"
  (deleteSelected)="selectTagForDelete($event)"
>
  @if (modalMode(); as modalMode) {
    @if (modalMode === 'create' || modalMode === 'update') {
      <div class="tags-operations-form">
        <hans-input
          [label]="resolveFieldLabel('slug')"
          [required]="fields.slug.required"
          inputColor="base"
          inputSize="medium"
          [value]="form().slug"
          [placeholder]="fields.slug.placeholderKey! | translate"
          [attr.aria-label]="fields.slug.labelKey | translate"
          (input)="emitSlugChange($any($event).target?.value ?? '')"
        ></hans-input>

        <hans-input
          [label]="resolveFieldLabel('namePt')"
          [required]="fields.namePt.required"
          inputColor="base"
          inputSize="medium"
          [value]="form().namePt"
          [placeholder]="fields.namePt.placeholderKey! | translate"
          [attr.aria-label]="fields.namePt.labelKey | translate"
          (input)="emitNamePtChange($any($event).target?.value ?? '')"
        ></hans-input>

        <hans-input
          [label]="resolveFieldLabel('nameEn')"
          [required]="fields.nameEn.required"
          inputColor="base"
          inputSize="medium"
          [value]="form().nameEn"
          [placeholder]="fields.nameEn.placeholderKey! | translate"
          [attr.aria-label]="fields.nameEn.labelKey | translate"
          (input)="emitNameEnChange($any($event).target?.value ?? '')"
        ></hans-input>

        <hans-input
          [label]="resolveFieldLabel('nameEs')"
          [required]="fields.nameEs.required"
          inputColor="base"
          inputSize="medium"
          [value]="form().nameEs"
          [placeholder]="fields.nameEs.placeholderKey! | translate"
          [attr.aria-label]="fields.nameEs.labelKey | translate"
          (input)="emitNameEsChange($any($event).target?.value ?? '')"
        ></hans-input>

        <hans-select-option
          [label]="resolveFieldLabel('type')"
          [required]="fields.type.required"
          [options]="tagTypeOptions()"
          [value]="form().type"
          [enableAutocomplete]="false"
          [noOptionsText]="'pages.admin.tags.fields.type.empty' | translate"
          inputSize="medium"
          inputColor="base"
          labelColor="base"
          dropdownBackgroundColor="var(--background-color)"
          dropdownHoverColor="var(--primary-neutral-color)"
          (change)="emitTypeChange(resolveSelectValue($event))"
          (valuechange)="emitTypeChange(resolveSelectValue($event))"
          (valueChange)="emitTypeChange(resolveSelectValue($event))"
        ></hans-select-option>

        <hans-input
          [label]="resolveFieldLabel('sortOrder')"
          [required]="fields.sortOrder.required"
          inputColor="base"
          inputSize="medium"
          [value]="form().sortOrder"
          [placeholder]="fields.sortOrder.placeholderKey! | translate"
          [attr.aria-label]="fields.sortOrder.labelKey | translate"
          (input)="emitSortOrderChange($any($event).target?.value ?? '')"
        ></hans-input>

        <app-operations-relation-picker
          [label]="'pages.experiences.customer.projects' | translate"
          [description]="'pages.admin.tags.fields.projects.description' | translate"
          [emptyMessage]="'common.empty.projectsForRelation' | translate"
          [options]="projectOptions()"
          [selectedIds]="form().projectIds"
          (toggled)="toggleProject($event)"
        ></app-operations-relation-picker>

        <app-operations-relation-picker
          [label]="'common.relations.technologies' | translate"
          [description]="'pages.admin.tags.fields.technologies.description' | translate"
          [emptyMessage]="'common.empty.technologiesForRelation' | translate"
          [options]="technologyOptions()"
          [selectedIds]="form().technologyIds"
          (toggled)="toggleTechnology($event)"
        ></app-operations-relation-picker>
      </div>
    }
  }
</app-operations-modal>
