<app-operations-modal
  [isOpen]="isOpen()"
  [titleKey]="modalTitleKey()"
  [descriptionKey]="descriptionKey()"
  [feedbackKey]="feedbackKey()"
  [feedbackTone]="feedbackTone()"
  [pagination]="pagination()"
  [showPagination]="showPagination()"
  [showSearch]="showPagination()"
  [searchValue]="searchValue()"
  [isLoading]="isLoading()"
  [isSubmitting]="isSubmitting()"
  [showSubmit]="showSubmit()"
  [submitLabelKey]="submitLabelKey()"
  [mode]="modalMode()"
  [items]="operationItems()"
  [detailedItems]="detailedOperationItems()"
  [selectedItem]="selectedOperationItem()"
  (closed)="requestClose()"
  (searchChanged)="searchChanged.emit($event)"
  (submitted)="submit()"
  (pageSelected)="selectPage($event)"
  (updateSelected)="selectImageAssetForUpdate($event)"
  (deleteSelected)="selectImageAssetForDelete($event)"
>
  @if (modalMode(); as modalMode) {
    @if (modalMode === 'create' || modalMode === 'update') {
      <div class="image-assets-operations-form">
        <hans-input
          [label]="resolveFieldLabel('fileName')"
          [required]="fields.fileName.required"
          inputColor="base"
          inputSize="medium"
          [value]="form().fileName"
          [placeholder]="fields.fileName.placeholderKey! | translate"
          [attr.aria-label]="fields.fileName.labelKey | translate"
          (input)="emitFileNameChange($any($event).target?.value ?? '')"
        ></hans-input>

        <hans-input
          [label]="resolveFieldLabel('filePath')"
          [required]="fields.filePath.required"
          inputColor="base"
          inputSize="medium"
          [value]="form().filePath"
          [placeholder]="fields.filePath.placeholderKey! | translate"
          [attr.aria-label]="fields.filePath.labelKey | translate"
          (input)="emitFilePathChange($any($event).target?.value ?? '')"
        ></hans-input>

        <hans-input
          [label]="resolveFieldLabel('folder')"
          [required]="fields.folder.required"
          inputColor="base"
          inputSize="medium"
          [value]="form().folder"
          [placeholder]="fields.folder.placeholderKey! | translate"
          [attr.aria-label]="fields.folder.labelKey | translate"
          (input)="emitFolderChange($any($event).target?.value ?? '')"
        ></hans-input>

        <hans-select-option
          [label]="resolveFieldLabel('kind')"
          [required]="fields.kind.required"
          [options]="imageAssetKindOptions()"
          [value]="form().kind"
          [enableAutocomplete]="false"
          [noOptionsText]="'pages.admin.imageAssets.fields.kind.empty' | translate"
          inputSize="medium"
          inputColor="base"
          labelColor="base"
          dropdownBackgroundColor="var(--background-color)"
          dropdownHoverColor="var(--primary-neutral-color)"
          (change)="emitKindChange(resolveSelectValue($event))"
          (valuechange)="emitKindChange(resolveSelectValue($event))"
          (valueChange)="emitKindChange(resolveSelectValue($event))"
        ></hans-select-option>

        <hans-input
          [label]="resolveFieldLabel('altPt')"
          [required]="fields.altPt.required"
          inputColor="base"
          inputSize="medium"
          [value]="form().altPt"
          [placeholder]="fields.altPt.placeholderKey! | translate"
          [attr.aria-label]="fields.altPt.labelKey | translate"
          (input)="emitAltPtChange($any($event).target?.value ?? '')"
        ></hans-input>

        <hans-input
          [label]="resolveFieldLabel('altEn')"
          [required]="fields.altEn.required"
          inputColor="base"
          inputSize="medium"
          [value]="form().altEn"
          [placeholder]="fields.altEn.placeholderKey! | translate"
          [attr.aria-label]="fields.altEn.labelKey | translate"
          (input)="emitAltEnChange($any($event).target?.value ?? '')"
        ></hans-input>

        <hans-input
          [label]="resolveFieldLabel('altEs')"
          [required]="fields.altEs.required"
          inputColor="base"
          inputSize="medium"
          [value]="form().altEs"
          [placeholder]="fields.altEs.placeholderKey! | translate"
          [attr.aria-label]="fields.altEs.labelKey | translate"
          (input)="emitAltEsChange($any($event).target?.value ?? '')"
        ></hans-input>

        <hans-input
          [label]="resolveFieldLabel('captionPt')"
          [required]="fields.captionPt.required"
          inputColor="base"
          inputSize="medium"
          [value]="form().captionPt"
          [placeholder]="fields.captionPt.placeholderKey! | translate"
          [attr.aria-label]="fields.captionPt.labelKey | translate"
          (input)="emitCaptionPtChange($any($event).target?.value ?? '')"
        ></hans-input>

        <hans-input
          [label]="resolveFieldLabel('captionEn')"
          [required]="fields.captionEn.required"
          inputColor="base"
          inputSize="medium"
          [value]="form().captionEn"
          [placeholder]="fields.captionEn.placeholderKey! | translate"
          [attr.aria-label]="fields.captionEn.labelKey | translate"
          (input)="emitCaptionEnChange($any($event).target?.value ?? '')"
        ></hans-input>

        <hans-input
          [label]="resolveFieldLabel('captionEs')"
          [required]="fields.captionEs.required"
          inputColor="base"
          inputSize="medium"
          [value]="form().captionEs"
          [placeholder]="fields.captionEs.placeholderKey! | translate"
          [attr.aria-label]="fields.captionEs.labelKey | translate"
          (input)="emitCaptionEsChange($any($event).target?.value ?? '')"
        ></hans-input>

        <hans-input
          [label]="resolveFieldLabel('mimeType')"
          [required]="fields.mimeType.required"
          inputColor="base"
          inputSize="medium"
          [value]="form().mimeType"
          [placeholder]="fields.mimeType.placeholderKey! | translate"
          [attr.aria-label]="fields.mimeType.labelKey | translate"
          (input)="emitMimeTypeChange($any($event).target?.value ?? '')"
        ></hans-input>

        <div class="image-assets-operations-dimensions">
          <hans-input
            [label]="resolveFieldLabel('width')"
            [required]="fields.width.required"
            inputColor="base"
            inputSize="medium"
            [value]="form().width"
            [placeholder]="fields.width.placeholderKey! | translate"
            [attr.aria-label]="fields.width.labelKey | translate"
            (input)="emitWidthChange($any($event).target?.value ?? '')"
          ></hans-input>

          <hans-input
            [label]="resolveFieldLabel('height')"
            [required]="fields.height.required"
            inputColor="base"
            inputSize="medium"
            [value]="form().height"
            [placeholder]="fields.height.placeholderKey! | translate"
            [attr.aria-label]="fields.height.labelKey | translate"
            (input)="emitHeightChange($any($event).target?.value ?? '')"
          ></hans-input>
        </div>

        <hans-input
          [label]="resolveFieldLabel('sortOrder')"
          [required]="fields.sortOrder.required"
          inputColor="base"
          inputSize="medium"
          [value]="form().sortOrder"
          [placeholder]="fields.sortOrder.placeholderKey! | translate"
          [attr.aria-label]="fields.sortOrder.labelKey | translate"
          (input)="emitSortOrderChange($any($event).target?.value ?? '')"
        ></hans-input>

        <app-operations-relation-picker
          [label]="'pages.experiences.customer.projects' | translate"
          [description]="'pages.admin.imageAssets.fields.projects.description' | translate"
          [emptyMessage]="'common.empty.projectsForRelation' | translate"
          [options]="projectOptions()"
          [selectedIds]="form().projectIds"
          (toggled)="toggleProject($event)"
        ></app-operations-relation-picker>

        <app-operations-relation-picker
          [label]="'pages.admin.links.fields.experiences.label' | translate"
          [description]="'pages.admin.imageAssets.fields.experiences.description' | translate"
          [emptyMessage]="'common.empty.experiencesForRelation' | translate"
          [options]="experienceOptions()"
          [selectedIds]="form().experienceIds"
          (toggled)="toggleExperience($event)"
        ></app-operations-relation-picker>

        <app-operations-relation-picker
          [label]="'common.relations.technologies' | translate"
          [description]="'pages.admin.imageAssets.fields.technologies.description' | translate"
          [emptyMessage]="'common.empty.technologiesForRelation' | translate"
          [options]="technologyOptions()"
          [selectedIds]="form().technologyIds"
          (toggled)="toggleTechnology($event)"
        ></app-operations-relation-picker>

        <app-operations-relation-picker
          [label]="'common.relations.formations' | translate"
          [description]="'pages.admin.imageAssets.fields.formations.description' | translate"
          [emptyMessage]="'common.empty.formations' | translate"
          [options]="formationOptions()"
          [selectedIds]="form().formationIds"
          (toggled)="toggleFormation($event)"
        />

        <app-operations-relation-picker
          [label]="'pages.admin.imageAssets.fields.spokenLanguages.label' | translate"
          [description]="'pages.admin.imageAssets.fields.spokenLanguages.description' | translate"
          [emptyMessage]="'pages.admin.imageAssets.fields.spokenLanguages.empty' | translate"
          [options]="spokenLanguageOptions()"
          [selectedIds]="form().spokenLanguageIds"
          (toggled)="toggleSpokenLanguage($event)"
        />

        <app-operations-relation-picker
          [label]="'common.relations.customers' | translate"
          [description]="'pages.admin.imageAssets.fields.customers.description' | translate"
          [emptyMessage]="'pages.admin.imageAssets.fields.customers.empty' | translate"
          [options]="customerOptions()"
          [selectedIds]="form().customerIds"
          (toggled)="toggleCustomer($event)"
        />

        <app-operations-relation-picker
          [label]="'pages.admin.imageAssets.fields.jobs.label' | translate"
          [description]="'pages.admin.imageAssets.fields.jobs.description' | translate"
          [emptyMessage]="'pages.admin.imageAssets.fields.jobs.empty' | translate"
          [options]="jobOptions()"
          [selectedIds]="form().jobIds"
          (toggled)="toggleJob($event)"
        />
      </div>
    }
  }
</app-operations-modal>
