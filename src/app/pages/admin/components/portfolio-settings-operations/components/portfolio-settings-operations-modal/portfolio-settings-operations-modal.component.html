<app-operations-modal
  [isOpen]="isOpen()"
  [titleKey]="modalTitleKey()"
  [descriptionKey]="descriptionKey()"
  [feedbackKey]="feedbackKey()"
  [feedbackTone]="feedbackTone()"
  [pagination]="pagination()"
  [showPagination]="showPagination()"
  [showSearch]="showPagination()"
  [searchValue]="searchValue()"
  [isLoading]="isLoading()"
  [isSubmitting]="isSubmitting()"
  [showSubmit]="showSubmit()"
  [submitLabelKey]="submitLabelKey()"
  [mode]="modalMode()"
  [items]="operationItems()"
  [detailedItems]="detailedOperationItems()"
  [selectedItem]="selectedOperationItem()"
  (closed)="requestClose()"
  (searchChanged)="searchChanged.emit($event)"
  (submitted)="submit()"
  (pageSelected)="selectPage($event)"
  (updateSelected)="selectSettingForUpdate($event)"
  (deleteSelected)="selectSettingForDelete($event)"
>
  @if (modalMode(); as modalMode) {
    @if (modalMode === 'create' || modalMode === 'update') {
      <div class="portfolio-settings-operations-form">
        <hans-input
          [label]="resolveFieldLabel('key')"
          [required]="fields.key.required"
          inputColor="base"
          inputSize="medium"
          [value]="form().key"
          [placeholder]="fields.key.placeholderKey! | translate"
          [attr.aria-label]="fields.key.labelKey | translate"
          (input)="emitKeyChange($any($event).target?.value ?? '')"
        ></hans-input>

        <hans-input
          [label]="resolveFieldLabel('description')"
          [required]="fields.description.required"
          inputColor="base"
          inputSize="medium"
          [value]="form().description"
          [placeholder]="fields.description.placeholderKey! | translate"
          [attr.aria-label]="fields.description.labelKey | translate"
          (input)="emitDescriptionChange($any($event).target?.value ?? '')"
        ></hans-input>

        <label class="portfolio-settings-operations-json-field">
          <span>{{ resolveFieldLabel('valueText') }}</span>
          <textarea
            [required]="fields.valueText.required"
            [attr.aria-required]="fields.valueText.required"
            [value]="form().valueText"
            [placeholder]="fields.valueText.placeholderKey! | translate"
            (input)="emitValueTextChange($any($event).target?.value ?? '')"
          ></textarea>
        </label>
      </div>
    }
  }
</app-operations-modal>
