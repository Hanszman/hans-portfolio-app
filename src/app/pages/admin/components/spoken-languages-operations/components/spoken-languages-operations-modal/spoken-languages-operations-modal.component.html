<app-operations-modal
  [isOpen]="isOpen()"
  [titleKey]="modalTitleKey()"
  [descriptionKey]="descriptionKey()"
  [feedbackKey]="feedbackKey()"
  [feedbackTone]="feedbackTone()"
  [pagination]="pagination()"
  [showPagination]="showPagination()"
  [showSearch]="showPagination()"
  [searchValue]="searchValue()"
  [isLoading]="isLoading()"
  [isSubmitting]="isSubmitting()"
  [showSubmit]="showSubmit()"
  [submitLabelKey]="submitLabelKey()"
  [mode]="modalMode()"
  [items]="operationItems()"
  [detailedItems]="detailedOperationItems()"
  [selectedItem]="selectedOperationItem()"
  (closed)="requestClose()"
  (searchChanged)="searchChanged.emit($event)"
  (submitted)="submit()"
  (pageSelected)="selectPage($event)"
  (updateSelected)="selectSpokenLanguageForUpdate($event)"
  (deleteSelected)="selectSpokenLanguageForDelete($event)"
>
  @if (modalMode(); as modalMode) {
    @if (modalMode === 'create' || modalMode === 'update') {
      <div class="spoken-languages-operations-form">
        <hans-input
          [label]="resolveFieldLabel('code')"
          inputColor="base"
          inputSize="medium"
          [value]="form().code"
          [placeholder]="fields.code.placeholderKey! | translate"
          [attr.aria-label]="fields.code.labelKey | translate"
          (input)="emitCodeChange($any($event).target?.value ?? '')"
        ></hans-input>

        <hans-input
          [label]="resolveFieldLabel('namePt')"
          inputColor="base"
          inputSize="medium"
          [value]="form().namePt"
          [placeholder]="fields.namePt.placeholderKey! | translate"
          [attr.aria-label]="fields.namePt.labelKey | translate"
          (input)="emitNamePtChange($any($event).target?.value ?? '')"
        ></hans-input>

        <hans-input
          [label]="resolveFieldLabel('nameEn')"
          inputColor="base"
          inputSize="medium"
          [value]="form().nameEn"
          [placeholder]="fields.nameEn.placeholderKey! | translate"
          [attr.aria-label]="fields.nameEn.labelKey | translate"
          (input)="emitNameEnChange($any($event).target?.value ?? '')"
        ></hans-input>

        <hans-select-option
          [label]="resolveFieldLabel('proficiency')"
          [options]="proficiencyOptions()"
          [value]="form().proficiency"
          [enableAutocomplete]="false"
          [noOptionsText]="'pages.admin.spokenLanguages.fields.proficiency.empty' | translate"
          inputSize="medium"
          inputColor="base"
          labelColor="base"
          dropdownBackgroundColor="var(--background-color)"
          dropdownHoverColor="var(--primary-neutral-color)"
          (change)="emitProficiencyChange(resolveSelectValue($event))"
          (valuechange)="emitProficiencyChange(resolveSelectValue($event))"
          (valueChange)="emitProficiencyChange(resolveSelectValue($event))"
        ></hans-select-option>

        <div class="spoken-languages-operations-toggle">
          <div class="spoken-languages-operations-selection-copy">
            <p>{{ 'pages.admin.spokenLanguages.fields.highlight.label' | translate }}</p>
            <span>
              {{ 'pages.admin.spokenLanguages.fields.highlight.description' | translate }}
            </span>
          </div>

          <hans-toggle
            [checked]="form().highlight"
            [toggleColor]="'primary'"
            [toggleSize]="'small'"
            [attr.aria-label]="'pages.admin.spokenLanguages.fields.highlight.label' | translate"
            (change)="emitHighlightChange($event)"
          ></hans-toggle>
        </div>

        <hans-input
          [label]="resolveFieldLabel('sortOrder')"
          inputColor="base"
          inputSize="medium"
          [value]="form().sortOrder"
          [placeholder]="fields.sortOrder.placeholderKey! | translate"
          [attr.aria-label]="fields.sortOrder.labelKey | translate"
          (input)="emitSortOrderChange($any($event).target?.value ?? '')"
        ></hans-input>

        <app-operations-relation-picker
          [label]="'pages.admin.spokenLanguages.fields.imageAssets.label' | translate"
          [description]="'pages.admin.spokenLanguages.fields.imageAssets.description' | translate"
          [emptyMessage]="'pages.admin.spokenLanguages.fields.imageAssets.empty' | translate"
          [options]="imageAssetOptions()"
          [selectedIds]="form().imageAssetIds"
          (toggled)="toggleImageAsset($event)"
        ></app-operations-relation-picker>
      </div>
    }
  }
</app-operations-modal>
