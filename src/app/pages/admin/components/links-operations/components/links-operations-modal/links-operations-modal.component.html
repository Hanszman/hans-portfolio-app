<app-operations-modal
  [isOpen]="isOpen()"
  [titleKey]="modalTitleKey()"
  [descriptionKey]="descriptionKey()"
  [feedbackKey]="feedbackKey()"
  [feedbackTone]="feedbackTone()"
  [pagination]="pagination()"
  [showPagination]="showPagination()"
  [showSearch]="showPagination()"
  [searchValue]="searchValue()"
  [isLoading]="isLoading()"
  [isSubmitting]="isSubmitting()"
  [showSubmit]="showSubmit()"
  [submitLabelKey]="submitLabelKey()"
  [mode]="modalMode()"
  [items]="operationItems()"
  [detailedItems]="detailedOperationItems()"
  [selectedItem]="selectedOperationItem()"
  (closed)="requestClose()"
  (searchChanged)="searchChanged.emit($event)"
  (submitted)="submit()"
  (pageSelected)="selectPage($event)"
  (updateSelected)="selectLinkForUpdate($event)"
  (deleteSelected)="selectLinkForDelete($event)"
>
  @if (modalMode(); as modalMode) {
    @if (modalMode === 'create' || modalMode === 'update') {
      <div class="links-operations-form">
        <hans-input
          [label]="resolveFieldLabel('url')"
          inputColor="base"
          inputSize="medium"
          [value]="form().url"
          [placeholder]="fields.url.placeholderKey! | translate"
          [attr.aria-label]="fields.url.labelKey | translate"
          (input)="emitUrlChange($any($event).target?.value ?? '')"
        ></hans-input>

        <hans-input
          [label]="resolveFieldLabel('labelPt')"
          inputColor="base"
          inputSize="medium"
          [value]="form().labelPt"
          [placeholder]="fields.labelPt.placeholderKey! | translate"
          [attr.aria-label]="fields.labelPt.labelKey | translate"
          (input)="emitLabelPtChange($any($event).target?.value ?? '')"
        ></hans-input>

        <hans-input
          [label]="resolveFieldLabel('labelEn')"
          inputColor="base"
          inputSize="medium"
          [value]="form().labelEn"
          [placeholder]="fields.labelEn.placeholderKey! | translate"
          [attr.aria-label]="fields.labelEn.labelKey | translate"
          (input)="emitLabelEnChange($any($event).target?.value ?? '')"
        ></hans-input>

        <hans-input
          [label]="resolveFieldLabel('descriptionPt')"
          inputColor="base"
          inputSize="medium"
          [value]="form().descriptionPt"
          [placeholder]="fields.descriptionPt.placeholderKey! | translate"
          [attr.aria-label]="fields.descriptionPt.labelKey | translate"
          (input)="emitDescriptionPtChange($any($event).target?.value ?? '')"
        ></hans-input>

        <hans-input
          [label]="resolveFieldLabel('descriptionEn')"
          inputColor="base"
          inputSize="medium"
          [value]="form().descriptionEn"
          [placeholder]="fields.descriptionEn.placeholderKey! | translate"
          [attr.aria-label]="fields.descriptionEn.labelKey | translate"
          (input)="emitDescriptionEnChange($any($event).target?.value ?? '')"
        ></hans-input>

        <hans-select-option
          [label]="resolveFieldLabel('type')"
          [options]="linkTypeOptions()"
          [value]="form().type"
          [enableAutocomplete]="false"
          [noOptionsText]="'pages.admin.links.fields.type.empty' | translate"
          inputSize="medium"
          inputColor="base"
          labelColor="base"
          dropdownBackgroundColor="var(--background-color)"
          dropdownHoverColor="var(--primary-neutral-color)"
          (change)="emitTypeChange(resolveSelectValue($event))"
          (valuechange)="emitTypeChange(resolveSelectValue($event))"
          (valueChange)="emitTypeChange(resolveSelectValue($event))"
        ></hans-select-option>

        <hans-input
          [label]="resolveFieldLabel('sortOrder')"
          inputColor="base"
          inputSize="medium"
          [value]="form().sortOrder"
          [placeholder]="fields.sortOrder.placeholderKey! | translate"
          [attr.aria-label]="fields.sortOrder.labelKey | translate"
          (input)="emitSortOrderChange($any($event).target?.value ?? '')"
        ></hans-input>

        <app-operations-relation-picker
          [label]="'pages.admin.links.fields.projects.label' | translate"
          [description]="'pages.admin.links.fields.projects.description' | translate"
          [emptyMessage]="'pages.admin.links.fields.projects.empty' | translate"
          [options]="projectOptions()"
          [selectedIds]="form().projectIds"
          (toggled)="toggleProject($event)"
        ></app-operations-relation-picker>

        <app-operations-relation-picker
          [label]="'pages.admin.links.fields.experiences.label' | translate"
          [description]="'pages.admin.links.fields.experiences.description' | translate"
          [emptyMessage]="'pages.admin.links.fields.experiences.empty' | translate"
          [options]="experienceOptions()"
          [selectedIds]="form().experienceIds"
          (toggled)="toggleExperience($event)"
        ></app-operations-relation-picker>

        <app-operations-relation-picker
          [label]="'pages.admin.links.fields.technologies.label' | translate"
          [description]="'pages.admin.links.fields.technologies.description' | translate"
          [emptyMessage]="'pages.admin.links.fields.technologies.empty' | translate"
          [options]="technologyOptions()"
          [selectedIds]="form().technologyIds"
          (toggled)="toggleTechnology($event)"
        ></app-operations-relation-picker>

        <app-operations-relation-picker
          [label]="'pages.admin.links.fields.formations.label' | translate"
          [description]="'pages.admin.links.fields.formations.description' | translate"
          [emptyMessage]="'pages.admin.links.fields.formations.empty' | translate"
          [options]="formationOptions()"
          [selectedIds]="form().formationIds"
          (toggled)="toggleFormation($event)"
        ></app-operations-relation-picker>
      </div>
    }
  }
</app-operations-modal>
