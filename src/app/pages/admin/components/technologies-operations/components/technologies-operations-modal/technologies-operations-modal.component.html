<app-operations-modal
  [isOpen]="isOpen()"
  [titleKey]="modalTitleKey()"
  [descriptionKey]="descriptionKey()"
  [feedbackKey]="feedbackKey()"
  [feedbackTone]="feedbackTone()"
  [pagination]="pagination()"
  [showPagination]="showPagination()"
  [showSearch]="showPagination()"
  [searchValue]="searchValue()"
  [isLoading]="isLoading()"
  [isSubmitting]="isSubmitting()"
  [showSubmit]="showSubmit()"
  [submitLabelKey]="submitLabelKey()"
  [mode]="modalMode()"
  [items]="operationItems()"
  [detailedItems]="detailedOperationItems()"
  [selectedItem]="selectedOperationItem()"
  (closed)="closed.emit()"
  (searchChanged)="searchChanged.emit($event)"
  (submitted)="submit()"
  (pageSelected)="pageSelected.emit($event)"
  (updateSelected)="updateSelected.emit($event)"
  (deleteSelected)="deleteSelected.emit($event)"
>
  @if (modalMode(); as modalMode) {
    @if (modalMode === 'create' || modalMode === 'update') {
      <div class="technologies-operations-form">
        <hans-input
          [label]="resolveFieldLabel('slug')"
          [required]="fields.slug.required"
          inputColor="base"
          inputSize="medium"
          [value]="form().slug"
          [placeholder]="fields.slug.placeholderKey! | translate"
          (input)="change('slug', $event)"
        ></hans-input>

        <hans-input
          [label]="resolveFieldLabel('name')"
          [required]="fields.name.required"
          inputColor="base"
          inputSize="medium"
          [value]="form().name"
          [placeholder]="fields.name.placeholderKey! | translate"
          (input)="change('name', $event)"
        ></hans-input>

        <hans-select-option
          [label]="resolveFieldLabel('category')"
          [required]="fields.category.required"
          [value]="form().category"
          [options]="categoryOptions()"
          inputSize="medium"
          inputColor="base"
          labelColor="base"
          dropdownBackgroundColor="var(--background-color)"
          dropdownHoverColor="var(--primary-neutral-color)"
          (change)="change('category', $event)"
          (valuechange)="change('category', $event)"
          (valueChange)="change('category', $event)"
        ></hans-select-option>

        <hans-select-option
          [label]="resolveFieldLabel('level')"
          [required]="fields.level.required"
          [value]="form().level"
          [options]="levelOptions()"
          inputSize="medium"
          inputColor="base"
          labelColor="base"
          dropdownBackgroundColor="var(--background-color)"
          dropdownHoverColor="var(--primary-neutral-color)"
          (change)="change('level', $event)"
          (valuechange)="change('level', $event)"
          (valueChange)="change('level', $event)"
        ></hans-select-option>

        <hans-select-option
          [label]="resolveFieldLabel('frequency')"
          [required]="fields.frequency.required"
          [value]="form().frequency"
          [options]="frequencyOptions()"
          inputSize="medium"
          inputColor="base"
          labelColor="base"
          dropdownBackgroundColor="var(--background-color)"
          dropdownHoverColor="var(--primary-neutral-color)"
          (change)="change('frequency', $event)"
          (valuechange)="change('frequency', $event)"
          (valueChange)="change('frequency', $event)"
        ></hans-select-option>

        <div class="technologies-operations-toggle">
          <div class="technologies-operations-selection-copy">
            <p>{{ 'pages.admin.technologies.fields.highlight.label' | translate }}</p>
            <span>{{ 'pages.admin.technologies.fields.highlight.description' | translate }}</span>
          </div>
          <hans-toggle
            [checked]="form().highlight"
            [toggleColor]="'primary'"
            [toggleSize]="'small'"
            [attr.aria-label]="'pages.admin.technologies.fields.highlight.label' | translate"
            (change)="toggleHighlight($event)"
          ></hans-toggle>
        </div>

        <hans-input
          [label]="resolveFieldLabel('sortOrder')"
          [required]="fields.sortOrder.required"
          inputColor="base"
          inputSize="medium"
          [value]="form().sortOrder"
          [placeholder]="fields.sortOrder.placeholderKey! | translate"
          (input)="change('sortOrder', $event)"
        ></hans-input>

        <app-operations-relation-picker
          [label]="'pages.admin.technologies.fields.imageAssets.label' | translate"
          [description]="'pages.admin.technologies.fields.imageAssets.description' | translate"
          [emptyMessage]="'pages.admin.technologies.fields.imageAssets.empty' | translate"
          [options]="imageOptions()"
          [selectedIds]="form().imageAssetIds"
          (toggled)="imageAssetToggled.emit($event)"
        ></app-operations-relation-picker>
      </div>
    }
  }
</app-operations-modal>
