<section class="experiences-operations">
  <div class="experiences-operations-copy">
    <p class="experiences-operations-kicker">
      // {{ 'pages.admin.experiences.sectionLabel' | translate }}
    </p>
    <h3>{{ 'pages.admin.entities.experiences.title' | translate }}</h3>
    <p>{{ 'pages.admin.entities.experiences.description' | translate }}</p>
  </div>
  <p class="experiences-operations-endpoint">{{ endpointLabel }}</p>
  <app-operations-actions
    [readDisabled]="!hasExperiences() || isLoading()"
    [updateDisabled]="!hasExperiences() || isLoading()"
    [deleteDisabled]="!hasExperiences() || isLoading()"
    (createClicked)="openCreateModal()"
    (readClicked)="openReadModal()"
    (updateClicked)="openUpdatePickerModal()"
    (deleteClicked)="openDeletePickerModal()"
  />
  <app-experiences-operations-modal
    [isOpen]="isModalOpen()"
    [modalMode]="modalMode()"
    [modalTitleKey]="modalTitleKey()"
    [experiences]="experiences()"
    [selectedExperience]="selectedExperience()"
    [form]="form()"
    [technologyOptions]="technologyOptions()"
    [projectOptions]="projectOptions()"
    [customerOptions]="customerOptions()"
    [jobOptions]="jobOptions()"
    [linkOptions]="linkOptions()"
    [imageAssetOptions]="imageAssetOptions()"
    [pagination]="pagination()"
    [searchValue]="searchQuery()"
    [feedbackKey]="modalFeedbackKey()"
    [isLoading]="isLoading()"
    [isSubmitting]="isSubmitting()"
    (closed)="closeModal()"
    (fieldChanged)="updateField($event.field, $event.value)"
    (booleanChanged)="updateBoolean($event.field, $event.value)"
    (relationToggled)="toggle($event.field, $event.id)"
    (submitted)="submitModal()"
    (updateSelected)="openUpdateModal($event)"
    (deleteSelected)="openDeleteModal($event)"
    (pageSelected)="goToPage($event)"
    (searchChanged)="updateSearchQuery($event)"
  />
</section>
